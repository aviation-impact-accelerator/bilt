[project]
site_name = "Bilt"
site_url = "https://aviation-impact-accelerator.github.io/bilt/"
site_description = "Documentation site for the Bilt package"
docs_dir = "docs"
repo_url = "https://github.com/aviation-impact-accelerator/bilt"

extra_css = [
    "stylesheets/mermaid-zoom.css",
]

extra_javascript = [
    "javascripts/mermaid-zoom.js",
    "javascripts/mathjax.js",
    "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

nav = [
    { "Home" = "index.md" },

    { "Get started" = [
        { "Your first Bilt model" = "getting-started/first-model.md" },
    ] },

    { "Bilt user guide" = [
        { "Modelling philosophy" = "guide/modelling-philosophy.md" },
        { "Systems and values" = "guide/systems-and-values.md" },
        { "Equations and acausal modelling" = "guide/equations-and-acausal-modelling.md" },
        { "Transforms and implementations" = "guide/transforms-and-implementations.md" },
        { "Models to computation" = "guide/models-to-computation.md" },
        { "Dimensions, domains and tensors" = "guide/dimensions-domains-and-tensors.md" },
        { "Systems of systems" = "guide/systems-of-systems.md" },
        { "Coupled systems" = "guide/coupled-systems.md" },
        { "Backends" = "guide/backends.md" },
        { "Units" = "guide/units.md" },
    ] },

    { "API reference" = [
        { "Systems and implementations" = "api/systems.md" },
        { "Equations and transforms" = "api/relationships.md" },
        { "Units" = "api/units.md" },
        { "Quantity annotations and typing" = "api/quantity-annotations.md" },
        { "Tensors" = "api/tensors.md" },
        { "Backends" = "api/backends.md" },
    ] },

    { "Tools and configuration" = [
        { "Check model definitions" = "check.md" },
        { "Ruff configuration" = "config.md" },
    ] },

    { "Bilt worked examples" = [

        { "Systems of systems" = [
            {"Two springs in series" = "worked_examples/two-springs-in-series.md"},
            {"Two shaft gas turbine" = "worked_examples/two-shaft-gas-turbine.md"},
        ] },

        { "Dimensions, Tensors and broadcasting" = [
            {"Battery electric mission model with quasi-monte carlo broadcasting" = "worked_examples/battery-electric-mission-model-with-quasi-monte-carlo-broadcasting.md"},
        ] },

        { "Backends" = [
            { "Compiling a Bilt model with JAX" = "worked_examples/compiling-a-bilt-model-with-JAX.md" },
        ] },
    ] },
]


[project.theme]
features = [
    "navigation.indexes",
]


[project.markdown_extensions]
pymdownx.arithmatex.generic = true

[project.plugins.markdown-exec]
