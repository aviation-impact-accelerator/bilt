default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-ast"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-xml"

[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]

[[repos.hooks]]
id = "debug-statements"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "name-tests-test"
args = ["--pytest-test-first"]

[[repos.hooks]]
id = "trailing-whitespace"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.6"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix"]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.4"

[[repos.hooks]]
id = "uv-lock"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
types = ["python"]
entry = "uv run pyrefly check"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "ty"
name = "ty"
types = ["python"]
entry = "uv run ty check"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "pytest"
name = "pytest"
stages = ["pre-push"]
types = ["python"]
entry = "uv run pytest"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "rust-fmt"
name = "rust fmt"
entry = "cargo fmt -- --check"
language = "system"
pass_filenames = false
types = ["rust"]

[[repos.hooks]]
id = "rust-clippy"
name = "rust clippy"
entry = "cargo clippy --all-targets --all-features -- -D warnings"
language = "system"
pass_filenames = false
types = ["rust"]

[[repos.hooks]]
id = "rust-test"
name = "rust test"
entry = "cargo test"
language = "system"
pass_filenames = false
types = ["rust"]
