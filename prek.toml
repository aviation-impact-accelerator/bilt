default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-ast"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-xml"

[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]

[[repos.hooks]]
id = "debug-statements"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "name-tests-test"
args = ["--pytest-test-first"]

[[repos.hooks]]
id = "trailing-whitespace"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.8"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix"]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.14"

[[repos.hooks]]
id = "uv-lock"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy"
types = ["python"]
entry = "uv run mypy"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "pytest"
name = "pytest"
stages = ["pre-push"]
types = ["python"]
entry = "uv run pytest"
language = "system"
pass_filenames = false
always_run = true
