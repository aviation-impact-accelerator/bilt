[project]
name = "bilt"
version = "0.0.1"
description = "Systems models using transforms."
readme = "README.md"
authors = [
    { name = "Sam Brockie", email = "sambrockie@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bilt-units>=0.0.1",
    "bilt-backend-rust>=0.0.1",
]

[tool.uv.sources]
bilt = { workspace = true }
bilt-units = { workspace = true }
bilt-backend-rust = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/bilt-core",
    "packages/bilt-units",
    "packages/bilt-backend-rust",
]

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.pytest.ini_options]
xfail_strict = true
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN1",
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-values-type = "tuple"

[tool.ruff.lint.per-file-ignores]
"src/*" = ["INP001", "D1"]
"tests/*" = ["D1", "FBT001", "INP001", "S101"]
"packages/*/src/bilt/**/*.py" = ["INP001"]
"packages/*/tests/**/*.py" = ["D1", "FBT001", "INP001", "S101"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
all = "error"
