[project]
name = "bilt"
version = "0.0.1"
description = "Systems models using transforms."
readme = "README.md"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.38",
]

docs = [
    "zensical>=0.0.37",
]

[tool.pyrefly]
python_version = "3.14"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN1",
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-values-type = "tuple"

[tool.ruff.lint.isort]
known-first-party = ["bilt"]

[tool.ruff.lint.per-file-ignores]
"packages/*/src/bilt/**/*.py" = ["INP001"]
"packages/*/src/examples/**/*.py" = ["D104"]
"packages/*/tests/**/*.py" = ["D1", "FBT001", "INP001", "S101"]
"src/*" = ["D1"]
"tests/*" = ["D1", "FBT001", "INP001", "S101"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
bilt-core = { workspace = true }
bilt-units = { workspace = true }
bilt-symbolic = { workspace = true }
examples = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/bilt-core",
    "packages/bilt-units",
    "packages/bilt-symbolic",
    "packages/examples"
]
