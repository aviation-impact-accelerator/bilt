[project]
name = "bilt"
version = "0.0.1"
description = "Systems models using transforms."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bilt-core",
]

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "mypy",
]

[tool.uv.sources]
bilt-core = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/bilt-core",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
xfail_strict = true
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN1",
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-values-type = "tuple"

[tool.ruff.lint.per-file-ignores]
"src/*" = ["INP001", "D1"]
"tests/*" = ["D1", "FBT001", "INP001", "S101"]
"packages/*/src/bilt/**/*.py" = ["INP001"]
"packages/*/tests/**/*.py" = ["D1", "FBT001", "INP001", "S101"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
all = "error"

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true

mypy_path = [
    "src",
    "packages/bilt-core/src",
]

files = [
    "src",
    "packages/bilt-core/src",
    "packages/bilt-core/tests",
    "tests",
]

exclude = [
    "^src/bilt/core/",
]
