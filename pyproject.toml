[project]
name = "bilt"
version = "0.2.0"
description = "Causal and acausal systems models in Python."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "networkx>=3.6.1",
    "rustworkx>=0.18.0"
]

[project.optional-dependencies]
jax = [
    "jax>=0.10.2",
]

[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "examples",
    "prek>=0.5.7",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

docs = [
    "zensical>=0.0.47",
    "markdown-exec[ansi]>=1.12.5",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
]

[tool.pyrefly]
python_version = "3.15"
search_path = ["src", "benchmarks"]

[tool.ty.environment]
extra-paths = ["benchmarks"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "packages"]
pythonpath = ["benchmarks"]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["PLR0917"]
ignore = [
    "ANN1",
    "COM812",
    "COM819",
    "CPY001",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
    "SIM300",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-values-type = "tuple"

[tool.ruff.lint.isort]
known-first-party = ["bilt"]

[tool.ruff.lint.per-file-ignores]
"packages/*/src/examples/**/*.py" = ["D104"]
"packages/*/tests/**/*.py" = ["D1", "FBT001", "INP001", "S101"]
"src/*" = ["D1"]
"tests/*" = ["D1", "FBT001", "INP001", "S101"]
"benchmarks/conftest.py" = ["D1", "INP001"]
"benchmarks/test_*.py" = ["D1", "FBT001", "INP001", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "3 days"

[tool.uv.sources]
examples = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/examples",
]

[tool.maturin]
manifest-path = "rust/bilt_native/Cargo.toml"
module-name = "bilt._native"
python-source = "src"
bindings = "pyo3"
strip = false
