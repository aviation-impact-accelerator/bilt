name: Profile plan-first ProgramIR

on:
  pull_request:
    paths:
      - ".github/workflows/profile-program-ir.yml"
      - "src/bilt/core/_program_ir.py"
      - "src/bilt/core/_structural_analysis/_realize.py"
      - "src/bilt/core/_structural_analysis/_realize_qualified.py"
      - "benchmarks/test_nested_coupled_plan_search.py"
      - "benchmarks/test_coupled_group_planning.py"
  workflow_dispatch:

jobs:
  compare:
    name: Paired cold planning profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out pre-ProgramIR compilation baseline (PR 486)
        uses: actions/checkout@v7
        with:
          repository: aviation-impact-accelerator/bilt
          ref: f3a0d15d028213451c426593b018cd602a07a381
          path: baseline

      - name: Check out candidate (PR 487)
        uses: actions/checkout@v7
        with:
          repository: aviation-impact-accelerator/bilt
          ref: ${{ github.event.pull_request.head.sha || 'prototype/plan-first-program-ir' }}
          path: candidate

      - name: Set up uv with Python 3.15
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install identical dependency groups in each revision
        run: |
          (cd baseline && uv sync --all-extras --all-groups)
          (cd candidate && uv sync --all-extras --all-groups)

      - name: Baseline cold-search and coupled-solve benchmarks
        working-directory: baseline
        run: |
          uv run pytest \
            benchmarks/test_nested_coupled_plan_search.py \
            benchmarks/test_coupled_group_planning.py \
            --search-rounds=25 \
            --benchmark-warmup=off \
            --benchmark-json=../baseline-profile.json \
            --timeout=30

      - name: Candidate cold-search and coupled-solve benchmarks
        working-directory: candidate
        run: |
          uv run pytest \
            benchmarks/test_nested_coupled_plan_search.py \
            benchmarks/test_coupled_group_planning.py \
            --search-rounds=25 \
            --benchmark-warmup=off \
            --benchmark-json=../candidate-profile.json \
            --timeout=30

      # Reverse execution order to expose systematic runner warmup/drift.
      - name: Candidate cold benchmarks (reverse-order replicate)
        working-directory: candidate
        run: |
          uv run pytest \
            benchmarks/test_nested_coupled_plan_search.py \
            benchmarks/test_coupled_group_planning.py \
            --search-rounds=25 \
            --benchmark-warmup=off \
            --benchmark-json=../candidate-profile-reverse.json \
            --timeout=30

      - name: Baseline cold benchmarks (reverse-order replicate)
        working-directory: baseline
        run: |
          uv run pytest \
            benchmarks/test_nested_coupled_plan_search.py \
            benchmarks/test_coupled_group_planning.py \
            --search-rounds=25 \
            --benchmark-warmup=off \
            --benchmark-json=../baseline-profile-reverse.json \
            --timeout=30

      - name: Isolate ProgramIR construction and compilation time
        working-directory: candidate
        run: |
          uv run python - <<'PY'
          import statistics
          import sys
          from time import perf_counter_ns
          from unittest.mock import patch

          sys.path.insert(0, "benchmarks")
          from coupled_group_planning import CoupledGroupTrial
          from nested_coupled_plan_search import NestedCoupledTrial
          import bilt.core._structural_analysis._realize as realize
          import bilt.core._structural_analysis._realize_qualified as qualified

          def profile(label, prepare):
              counts = {"build": 0, "compile": 0}
              totals = {"build": 0, "compile": 0}
              durations = []
              def wrap(name, original):
                  def measured(*args, **kwargs):
                      start = perf_counter_ns()
                      try:
                          return original(*args, **kwargs)
                      finally:
                          totals[name] += perf_counter_ns() - start
                          counts[name] += 1
                  return measured
              for _ in range(30):
                  trial = prepare()
                  try:
                      with (
                          patch.object(realize, "program_from_plan", wrap("build", realize.program_from_plan)),
                          patch.object(realize, "_compile_program", wrap("compile", realize._compile_program)),
                          patch.object(qualified, "program_from_qualified_plan", wrap("build", qualified.program_from_qualified_plan)),
                          patch.object(qualified, "_compile_qualified_program", wrap("compile", qualified._compile_qualified_program)),
                      ):
                          start = perf_counter_ns()
                          trial.analyse()
                          durations.append(perf_counter_ns() - start)
                      trial.check()
                  finally:
                      trial.close()
              print(
                  "COMPONENT",
                  label,
                  "total_median_ms=" + str(round(statistics.median(durations) / 1e6, 5)),
                  "build_calls=" + str(counts["build"]),
                  "build_total_ms=" + str(round(totals["build"] / 1e6, 5)),
                  "compile_calls=" + str(counts["compile"]),
                  "compile_total_ms=" + str(round(totals["compile"] / 1e6, 5)),
              )

          profile("group_3", lambda: CoupledGroupTrial.prepare(3))
          profile("group_4", lambda: CoupledGroupTrial.prepare(4))
          profile("nested_explicit", lambda: NestedCoupledTrial.prepare(coupled=False))
          profile("nested_coupled", lambda: NestedCoupledTrial.prepare(coupled=True))
          PY

      - name: Compare same-run distributions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path("baseline-profile.json").read_text())
          candidate = json.loads(Path("candidate-profile.json").read_text())
          reverse_baseline = json.loads(Path("baseline-profile-reverse.json").read_text())
          reverse_candidate = json.loads(Path("candidate-profile-reverse.json").read_text())
          def entries(data):
              return {x["name"]: x for x in data["benchmarks"]}
          before = entries(baseline)
          after = entries(candidate)
          before_reverse = entries(reverse_baseline)
          after_reverse = entries(reverse_candidate)
          assert before.keys() == after.keys() == before_reverse.keys() == after_reverse.keys(), "Benchmark cases differ"

          lines = [
              "## Paired #486 versus #487 cold-planning profile",
              "",
              "Setup and model construction are outside the timed region; each round uses",
              "a fresh implementation and evaluation context. Both revisions run on the",
              "same GitHub-hosted runner, with both AB and BA order, 25 fresh rounds",
              "per case per order. Values below are median times per order.",
              "",
              "| Case | AB ratio | BA ratio | Geometric mean ratio |",
              "|---|---:|---:|---:|",
          ]
          for name in sorted(before):
              old = before[name]["stats"]["median"] * 1000
              new = after[name]["stats"]["median"] * 1000
              ratio = new / old
              ratio_reverse = after_reverse[name]["stats"]["median"] / before_reverse[name]["stats"]["median"]
              geometric = (ratio * ratio_reverse) ** 0.5
              lines.append(f"| `{name}` | {ratio:.3f}x | {ratio_reverse:.3f}x | {geometric:.3f}x |")
              print(
                  f"PROFILE {name} baseline_ms={old:.6f} candidate_ms={new:.6f} "
                  f"ab_ratio={ratio:.6f} ba_ratio={ratio_reverse:.6f} geo_ratio={geometric:.6f}"
              )

          lines += [
              "",
              "These are paired CI-run measurements, not a controlled local performance",
              "study. Median differences near runner jitter should not be overinterpreted.",
              "The benchmarks exclude model construction and do not measure JAX JIT",
              "first-call latency or numerical execution throughput.",
          ]
          summary = "\n".join(lines) + "\n"
          print(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(summary)
          PY

      - name: Upload raw benchmark distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-ir-paired-benchmarks
          path: |
            baseline-profile*.json
            candidate-profile*.json
          if-no-files-found: warn
