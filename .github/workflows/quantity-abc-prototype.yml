name: Quantity ABC prototype

on:
  workflow_dispatch:
  push:
    branches: [prototype/quantity-abc-annotations]
    paths: ['prototypes/quantity_abc/**', '.github/workflows/quantity-abc-prototype.yml']
  pull_request:
    paths: ['prototypes/quantity_abc/**', '.github/workflows/quantity-abc-prototype.yml']

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.15'
      - run: uv sync --all-extras --all-groups
      - run: uv run pytest -q prototypes/quantity_abc/tests
      - run: uv run ty check prototypes/quantity_abc
      - run: uv run pyrefly check --search-path . prototypes/quantity_abc
      - run: uv run ruff check prototypes/quantity_abc
      - run: uv run ruff format --check prototypes/quantity_abc
