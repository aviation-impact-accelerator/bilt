name: Quantity typing prototype

on:
  workflow_dispatch:
  push:
    branches: [prototype/quantity-dimension-typing]
    paths: ['prototypes/quantity_typing/**', '.github/workflows/quantity-typing-prototype.yml']
  pull_request:
    paths: ['prototypes/quantity_typing/**', '.github/workflows/quantity-typing-prototype.yml']

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv venv --python 3.15 .venv-prototype
      - run: uv pip install --python .venv-prototype/bin/python -r prototypes/quantity_typing/requirements.txt
      - run: .venv-prototype/bin/python prototypes/quantity_typing/check.py
      - run: .venv-prototype/bin/ruff check prototypes/quantity_typing
      - run: .venv-prototype/bin/ruff format --check prototypes/quantity_typing
