name: preview-destroy

on:
  pull_request:
    types: [closed]

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_BOT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.BILT_BOT_CLOUDFLARE_TEMP }}
    steps:
      - name: Delete all deployments from this branch
        run: |
          IDs="$(npx wrangler pages deployment list --project-name=bilt --json | jq -r '.[] | select(.Branch == "${{ github.event.pull_request.head.ref }}") | .Id')"
          for ID in $IDs; do
            npx wrangler pages deployment delete "$ID" --project-name=bilt --force
          done
