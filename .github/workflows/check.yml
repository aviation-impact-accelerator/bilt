name: check

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  matrix-check:
    name: Matrix checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.14"

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-packages --extra jax

      - name: Configure PyO3 Python
        run: |
          echo "PYO3_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Format with Ruff
        run: uv run ruff format --check

      - name: Type check with Pyrefly
        run: uv run pyrefly check

      - name: Type check with ty
        run: uv run ty check

      - name: Test with pytest
        run: uv run pytest

      - name: Format with rustfmt
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test with cargo
        run: cargo test --all-targets --all-features

      - name: Check with prek
        run: uv run prek run --all-files

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4
      - uses: ./.github/actions/setup_python
      - uses: ./.github/actions/job_url
        id: job_url
        with:
          step_name: 'pytest'
      - name: pytest
        run: |
          pytest
      - name: Test coverage summary report
        id: coverage_report
        if: always()
        run: |
          {
            echo "COVERAGE_REPORT<<EOF"
            coverage report --format=markdown --show-missing --skip-covered
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Remove previous coverage comments
        uses: ./.github/actions/remove_comments
        if: always()
        with:
          identifier: coverage
      - name: Test coverage PR comment
        id: coverage_comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `[coverage](${{steps.job_url.outputs.job_url}})
              \r\n\r\n${{steps.coverage_report.outputs.COVERAGE_REPORT}}`
            })


  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    needs:
      - matrix-check
    if: ${{ always() }}

    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.matrix-check.result }}" != "success" ]]; then
            echo "Matrix checks failed or were cancelled."
            exit 1
          fi

          echo "All matrix checks passed."
