name: check

on:
  pull_request:
  push:
    branches:
      - main

env:
  UV_LOCKED: 1

defaults:
  run:
    shell: bash

jobs:
  matrix-check:
    name: Matrix checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version: ["3.15"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust
        run: rustup toolchain install

      - name: Check development skill script syntax
        run: bash -n .agents/skills/bilt-development/scripts/check.sh

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Configure PyO3 Python
        run: |
          echo "PYO3_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Verify generated README illustrations
        run: uv run python scripts/generate_readme_svgs.py --check

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Format with Ruff
        run: uv run ruff format --check

      - name: Type check with Pyrefly
        run: uv run pyrefly check

      - name: Type check with ty
        run: uv run ty check

      - name: Test with pytest
        run: uv run pytest --durations=100 --durations-min=0.01

      - name: Verify bounded nested coupled planning benchmark
        run: uv run --with pytest-benchmark==5.3.1 pytest benchmarks/test_nested_coupled_plan_search.py --benchmark-disable --search-rounds=1 --timeout=30

      - name: Verify larger coupled linear benchmarks
        run: uv run --with pytest-benchmark==5.3.1 pytest benchmarks/test_coupled_group_planning.py --benchmark-disable --search-rounds=1 --timeout=30

      - name: Verify compact incidence scaling benchmarks
        run: uv run --with pytest-benchmark==5.3.1 pytest benchmarks/test_compact_incidence.py --benchmark-disable --timeout=30

      - name: Format with rustfmt
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test with cargo
        run: cargo test --all-targets --all-features

      - name: Build docs with Zensical
        run: uv run zensical build --clean --strict

      - name: Check with prek
        run: uv run prek run --all-files

  optimisation-ipopt:
    name: Compare IPOPT and POUNCE optimisation
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv with Python 3.15
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust
        run: rustup toolchain install

      - name: Install IPOPT development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config coinor-libipopt-dev
          pkg-config --modversion ipopt

      - name: Install Bilt and JAX
        run: uv sync --extra jax --group dev

      - name: Install compatible JAX 0.11, asdex 0.6.1 and cyipopt
        run: uv pip install --python .venv/bin/python "jax==0.11.2" "jaxlib==0.11.2" "cyipopt==1.7.0" "git+https://github.com/adrhill/asdex.git@84a9fc1a8926ce5ffd729cabc4fc811f69af0a80"

      - name: Install prebuilt POUNCE wheel
        run: uv pip install --python .venv/bin/python "pounce-solver==0.16.0"

      - name: Verify solver imports
        run: uv run --no-sync python -c "import asdex, cyipopt, pounce; print('All three solver dependencies installed')"

      - name: Verify sparse derivatives and run IPOPT
        run: uv run --no-sync pytest -v -o log_cli=true -o log_cli_level=INFO packages/examples/tests/test_asdex_ipopt_cruise.py::test_sparse_derivatives_match_dense_jax packages/examples/tests/test_asdex_ipopt_cruise.py::test_ipopt_matches_analytic_solution packages/examples/tests/test_asdex_ipopt_cruise.py::test_pounce_and_ipopt_agree_on_lowered_bilt_model

  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    needs:
      - matrix-check
      - optimisation-ipopt
    if: ${{ always() }}

    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.matrix-check.result }}" != "success" ]]; then
            echo "Matrix checks failed or were cancelled."
            exit 1
          fi

          if [[ "${{ needs.optimisation-ipopt.result }}" != "success" ]]; then
            echo "Bilt/IPOPT/POUNCE comparison failed or was cancelled."
            exit 1
          fi

          echo "All checks, including IPOPT optimisation, passed."
