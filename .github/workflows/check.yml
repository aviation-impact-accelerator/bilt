name: check

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  matrix-check:
    name: Matrix checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.14"

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        if: ${{ !env.ACT }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust
        if: ${{ !env.ACT }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        if: ${{ !env.ACT }}
        run: uv sync --python ${{ matrix.python-version }} --all-packages --extra jax

      - name: Configure PyO3 Python
        run: |
          echo "PYO3_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Format with Ruff
        run: uv run ruff format --check

      - name: Type check with Pyrefly
        run: uv run pyrefly check

      - name: Type check with ty
        run: uv run ty check

      - name: Test with pytest
        run: uv run pytest

      - name: Format with rustfmt
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test with cargo
        run: cargo test --all-targets --all-features

      - name: Check with prek
        run: uv run prek run --all-files

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        if: ${{ !env.ACT }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust
        if: ${{ !env.ACT }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        if: ${{ !env.ACT }}
        run: uv sync --python 3.14 --all-packages --extra jax

      - name: Run pytest-cov and save to markdown
        run: |
          uv run pytest --cov=. \
            --cov-report=term-missing:skip-covered \
            --cov-report=markdown:coverage.md

      - name: Echo coverage markdown to GitHub Step Summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat coverage.md >> $GITHUB_STEP_SUMMARY

      - name: Remove previous job comments
        uses: actions/github-script@v9
        with:
          script: |
            const pr_comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            await Promise.all(
              pr_comments.data.filter(
                comment => comment.body?.startsWith("## Coverage Report")
              ).map(
                comment => github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  comment_id: comment.id,
                })
              )
            )

      - name: Post coverage markdown as PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const filePath = path.join(process.env.GITHUB_WORKSPACE, "coverage.md");

            let fileContent = "";
            try {
              fileContent = fs.readFileSync(filePath, "utf8");
            } catch (err) {
              fileContent = `Could not read coverage file: ${err.message}`;
            }

            const commentBody = `## Coverage Report\n${fileContent}`;

            if (process.env.ACT === "true") {
              console.log("=== ACT LOCAL TEST ===");
              console.log("This text would have been posted to GitHub:\n", commentBody);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    needs:
      - matrix-check
    if: ${{ always() }}

    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.matrix-check.result }}" != "success" ]]; then
            echo "Matrix checks failed or were cancelled."
            exit 1
          fi

          echo "All matrix checks passed."
