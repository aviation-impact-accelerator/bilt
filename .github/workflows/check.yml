name: check

on:
  pull_request:
  push:
    branches:
      - main

env:
  UV_LOCKED: 1

defaults:
  run:
    shell: bash

jobs:
  matrix-check:
    name: Matrix checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version: ["3.15"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust
        run: rustup toolchain install

      - name: Check development skill script syntax
        run: bash -n .agents/skills/bilt-development/scripts/check.sh

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Configure PyO3 Python
        run: |
          echo "PYO3_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Verify generated README illustrations
        run: uv run python scripts/generate_readme_svgs.py --check

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Format with Ruff
        run: uv run ruff format --check

      - name: Type check with Pyrefly
        run: uv run pyrefly check

      - name: Type check with ty
        run: uv run ty check

      - name: Test with pytest
        run: uv run pytest --durations=100 --durations-min=0.01

      - name: Verify bounded nested coupled planning benchmark
        run: uv run --with pytest-benchmark==5.3.1 pytest benchmarks/test_nested_coupled_plan_search.py --benchmark-disable --search-rounds=1 --timeout=30

      - name: Verify larger coupled linear benchmarks
        run: uv run --with pytest-benchmark==5.3.1 pytest benchmarks/test_coupled_group_planning.py --benchmark-disable --search-rounds=1 --timeout=30

      - name: Format with rustfmt
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test with cargo
        run: cargo test --all-targets --all-features

      - name: Build docs with Zensical
        run: uv run zensical build --clean --strict

      - name: Check with prek
        run: uv run prek run --all-files

  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    needs:
      - matrix-check
    if: ${{ always() }}

    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.matrix-check.result }}" != "success" ]]; then
            echo "Matrix checks failed or were cancelled."
            exit 1
          fi

          echo "All matrix checks passed."
