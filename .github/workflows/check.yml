name: check

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  matrix-check:
    name: Matrix checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.14"

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-packages

      - name: Configure PyO3 Python
        run: |
          echo "PYO3_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Format with Ruff
        run: uv run ruff format --check

      - name: Type check with Pyrefly
        run: uv run pyrefly check

      - name: Type check with ty
        run: uv run ty check

      - name: Test with pytest
        run: uv run pytest

      - name: Format with rustfmt
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test with cargo
        run: cargo test --all-targets --all-features

      - name: Check with prek
        run: uv run prek run --all-files

  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    needs:
      - matrix-check
    if: ${{ always() }}

    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.matrix-check.result }}" != "success" ]]; then
            echo "Matrix checks failed or were cancelled."
            exit 1
          fi

          echo "All matrix checks passed."
