<svg xmlns="http://www.w3.org/2000/svg" width="960" height="278" viewBox="0 0 960 278" role="img" aria-labelledby="title description">
<title id="title">Uncertainty propagation through an inverse relationship</title>
<desc id="description">With input energy held at 100, a distribution of output-energy measurements maps through the inverse equation to a distribution of efficiency. The first curve is muted; inferred efficiency is teal. This is uncertainty propagation, not statistical fitting.</desc>
<rect width="960" height="278" fill="#273137"/>
<text x="58" y="36" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A9B8B2">Uncertainty propagation</text>
<text x="58" y="69" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#DDE5DF">Output energy</text>
<text x="585" y="69" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#DDE5DF">Efficiency</text>
<text x="58" y="92" font-family="STIX Two Math, Cambria Math, Georgia, serif" font-size="17" fill="#DDE5DF">Eₒᵤₜ ~ N(36, 2²)</text>
<text x="585" y="92" font-family="STIX Two Math, Cambria Math, Georgia, serif" font-size="17" fill="#DDE5DF">η ~ N(0.36, 0.02²)</text>
