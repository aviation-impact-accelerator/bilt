authors = [
    { name = "Sam Brockie", email = "sgb39@cam.ac.uk" },
    { name = "James Emberton", email = "je484@cam.ac.uk" },
    { name = "Nicolas Seyedzadeh", email = "ns896@cam.ac.uk" },
]
requires-python = ">=3.14"
