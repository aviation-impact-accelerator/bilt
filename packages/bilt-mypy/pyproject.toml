[project]
name = "bilt-mypy"
version = "0.0.1"
description = "Mypy plugin for bilt."
readme = "README.md"
authors = [
    { name = "Sam Brockie", email = "sgb39@cam.ac.uk" },
    { name = "James Emberton", email = "je484@cam.ac.uk" },
    { name = "Nicolas Seyedzadeh", email = "ns896@cam.ac.uk" },
]
requires-python = ">=3.14"
dependencies = [
    "bilt-core",
    "mypy>=1.20.2",
]

[build-system]
requires = [
    "uv_build>=0.11.14,<0.12"
]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bilt"
namespace = true
