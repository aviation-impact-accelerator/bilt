[project]
name = "bilt-backend-rust"
version = "0.0.1"
description = "Systems models using transforms."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "bilt.backend_rust._rust"
python-source = "."
features = ["pyo3/extension-module"]
