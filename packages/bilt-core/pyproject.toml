[project]
name = "bilt-core"
version = "0.0.1"
description = "Systems models using transforms."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["bilt-units>=0.0.1",]

[tool.uv.sources]
bilt-units = { workspace = true }

[tool.uv.build-backend]
module-name = "bilt"
namespace = true

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
